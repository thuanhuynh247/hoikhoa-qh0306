<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hội Khóa QH 2003–2006 · Hẹn Nhau Ngày Về</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;0,900;1,600;1,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Hệ màu chính thức từ logo hội khóa */
  --green:#1D6434;      /* xanh lá đậm - chủ đạo */
  --green-d:#144827;    /* xanh đậm hơn */
  --green-l:#2E8049;    /* xanh sáng */
  --red:#BF1B2C;        /* đỏ - màu nhấn */
  --red-d:#9A1523;
  --red-l:#D83848;
  --cream:#FBF6EC;      /* nền kem sáng */
  --cream2:#F3EAD6;
  --paper:#FFFFFF;
  --ink:#1A2E20;        /* chữ đậm trên nền sáng */
  --ink2:#4A5D50;
  --gold:#C9A84C;       /* điểm nhấn vàng nhẹ (accent phụ) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--cream);color:var(--ink)}

/* ═══ BACKDROP ═══ */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--cream)}
.bd-layer{
  position:absolute;inset:-40px;
  background-size:cover;background-position:center;
  filter:blur(48px) brightness(.92) saturate(1.12);
  opacity:0;transform:scale(1.15);
  transition:opacity 2s ease-in-out;
}
.bd-layer.active{opacity:.4}
.backdrop::after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 80% at 50% 42%,rgba(251,246,236,.55) 0%,rgba(251,246,236,.78) 60%,rgba(251,246,236,.95) 100%),
    linear-gradient(180deg,rgba(251,246,236,.9) 0%,rgba(251,246,236,.5) 22%,rgba(251,246,236,.45) 55%,rgba(251,246,236,.72) 82%,rgba(251,246,236,.98) 100%);
}
/* Hoa văn chấm bi mờ (gợi từ logo) */
.backdrop::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle, rgba(29,100,52,.05) 1px, transparent 1.5px);
  background-size:28px 28px;
}

/* ═══ VIỀN TRANG TRÍ khung ═══ */
.frame-deco{position:fixed;inset:14px;z-index:4;pointer-events:none;border:1.5px solid rgba(29,100,52,.14);border-radius:12px}
.frame-deco::before{content:'';position:absolute;inset:5px;border:1px solid rgba(191,27,44,.1);border-radius:8px}

/* ═══ HEADER ═══ */
.header{position:fixed;top:0;left:0;right:0;z-index:30;padding:22px 32px 0;text-align:center}
.hdr-logo{
  height:118px;width:auto;margin:0 auto 4px;display:block;
  filter:drop-shadow(0 6px 18px rgba(29,100,52,.18));
}
.hdr-logo-fallback{
  width:64px;height:64px;border-radius:50%;margin:0 auto 10px;
  border:2.5px solid var(--green);background:var(--paper);
  display:none;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:900;color:var(--red);
  box-shadow:0 6px 20px rgba(29,100,52,.2);
}
.hdr-title{
  font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:900;
  color:var(--green);letter-spacing:.3px;line-height:1.1;
  text-shadow:0 1px 2px rgba(255,255,255,.6);
}
.hdr-sub{font-size:11px;font-weight:600;color:var(--ink2);margin-top:5px;letter-spacing:1.5px}
.hdr-motto{
  display:inline-block;margin-top:11px;padding:5px 24px;
  border-radius:24px;background:var(--red);
  font-family:'Dancing Script',cursive;font-size:22px;font-weight:700;
  color:#fff;letter-spacing:.5px;line-height:1;
  box-shadow:0 4px 14px rgba(191,27,44,.28);
}

/* ═══ FRAME (khung ảnh) ═══ */
.photo-stage{
  position:fixed;left:50%;top:calc(50% + 8px);transform:translate(-50%,-50%);
  z-index:10;width:min(58vw,52vh);height:min(58vw,52vh);
  max-width:560px;max-height:560px;pointer-events:none;
}
.photo-card{
  position:absolute;inset:0;border-radius:12px;overflow:hidden;background:var(--paper);
  border:4px solid var(--paper);
  box-shadow:
    0 0 0 2px rgba(29,100,52,.22),
    0 0 0 10px rgba(255,255,255,.55),
    0 30px 70px rgba(29,100,52,.24),
    0 12px 30px rgba(0,0,0,.16);
  opacity:0;transform:scale(.9);
  transition:opacity 1.4s cubic-bezier(.4,0,.2,1), transform 1.4s cubic-bezier(.4,0,.2,1);
}
.photo-card.active{opacity:1;transform:scale(1)}
.photo-card.exit{opacity:0;transform:scale(1.06);transition:opacity 1.4s cubic-bezier(.4,0,.2,1), transform 1.4s cubic-bezier(.4,0,.2,1)}
/* Hiệu ứng Ken Burns: ảnh zoom nhẹ trong lúc hiển thị */
.photo-card img{
  width:100%;height:100%;object-fit:contain;background:#fff;display:block;
  transform:scale(1);transition:transform 6.5s ease-out;
}
.photo-card.active img{transform:scale(1.06)}

/* ═══ BADGE tên lớp ═══ */
.photo-badge{
  position:absolute;left:50%;bottom:-16px;transform:translateX(-50%) translateY(8px);
  z-index:12;background:var(--green);
  border:2px solid var(--paper);border-radius:24px;padding:7px 24px;
  box-shadow:0 8px 22px rgba(29,100,52,.32);
  opacity:0;transition:opacity .8s ease .2s, transform .8s ease .2s;white-space:nowrap;
}
.photo-badge.show{opacity:1;transform:translateX(-50%) translateY(0)}
.photo-badge .pb-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.7)}
.photo-badge .pb-name{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:900;color:#fff;line-height:1;margin-top:1px}

/* ═══ COUNTDOWN ═══ */
.countdown-zone{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:25;text-align:center;width:100%;padding:0 20px}
.cd-eyebrow{
  display:inline-block;
  font-size:10px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
  color:var(--red);margin-bottom:16px;
  background:rgba(251,246,236,.82);backdrop-filter:blur(6px);
  padding:6px 18px;border-radius:16px;
}
.cd-grid{display:flex;align-items:stretch;justify-content:center;gap:11px}
.cd-unit{
  position:relative;background:var(--paper);
  border:2px solid rgba(29,100,52,.15);border-radius:16px;
  padding:14px 22px 10px;min-width:96px;
  box-shadow:0 8px 28px rgba(29,100,52,.12);overflow:hidden;
}
.cd-unit::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--green),var(--green-l))}
.cd-unit:nth-child(3)::before{background:linear-gradient(90deg,var(--red),var(--red-l))}
.cd-unit:nth-child(5)::before{background:linear-gradient(90deg,var(--green),var(--green-l))}
.cd-unit:nth-child(7)::before{background:linear-gradient(90deg,var(--red),var(--red-l))}
.cd-num{
  font-family:'Cormorant Garamond',serif;font-size:54px;font-weight:900;
  color:var(--green);line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums;
}
.cd-unit:nth-child(3) .cd-num,.cd-unit:nth-child(7) .cd-num{color:var(--red)}
.cd-lbl{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink2);margin-top:8px}
.cd-colon{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:900;color:var(--green);align-self:center;margin-bottom:16px;opacity:.4;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:.12}}
.cd-event{margin-top:16px;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--green);letter-spacing:.3px}
.cd-event strong{color:var(--red)}

/* ═══ PROGRESS + COUNTER ═══ */
.slide-progress{position:fixed;top:0;left:0;height:3px;z-index:35;background:linear-gradient(90deg,var(--green),var(--red));width:0}
.img-counter{position:fixed;top:18px;right:22px;z-index:30;font-size:11px;font-weight:700;color:var(--green);background:var(--paper);padding:5px 13px;border-radius:14px;border:1.5px solid rgba(29,100,52,.15);box-shadow:0 2px 8px rgba(29,100,52,.1);font-variant-numeric:tabular-nums}

/* ═══ LOADING ═══ */
#loading{position:fixed;inset:0;z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream)}
.spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(29,100,52,.15);border-top-color:var(--green);animation:spin .8s linear infinite;margin-bottom:16px}
.load-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:900;color:var(--green);letter-spacing:.3px}
.load-sub{font-size:11px;color:var(--ink2);margin-top:6px;font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floatIn{from{opacity:0;transform:scale(.62) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

@media(max-width:680px){
  .hdr-logo{height:88px}
  .hdr-title{font-size:22px}
  .hdr-motto{font-size:18px;padding:4px 18px}
  .photo-stage{width:min(80vw,50vh);height:min(80vw,50vh);top:calc(50% - 10px)}
  .cd-grid{gap:6px}
  .cd-unit{min-width:62px;padding:10px 8px 8px;border-radius:12px}
  .cd-num{font-size:34px}
  .cd-colon{font-size:24px;margin-bottom:12px}
  .cd-lbl{font-size:8px;letter-spacing:1px}
  .cd-event{font-size:14px}
  .photo-badge .pb-name{font-size:19px}
  .frame-deco{inset:8px}
}
</style>
</head>

const LOP_SLUG = {
  "12/1":"12-1","12/2":"12-2","12/3":"12-3","12/4":"12-4","12/5":"12-5",
  "12/6":"12-6","12/7":"12-7","12/8":"12-8","12/9":"12-9","12/10":"12-10",
  "12 Toán":"12-toan","12 Lý Sinh":"12-ly-sinh","12 Hóa":"12-hoa",
  "12 Anh":"12-anh","12 Văn Pháp":"12-van-phap"
};

let PHOTOS = [], idx = 0, flip = 0, timer = null;

function loadManifest() {
  const list = [];
  const BAD_EXT = /\.(bmp)$/i;
  const seen = new Set();
  Object.keys(IMAGE_DATA).forEach(lop => {
    const folder = LOP_SLUG[lop] || lopToFolder(lop);
    (IMAGE_DATA[lop] || []).forEach(file => {
      if (!file || BAD_EXT.test(file)) return;
      const key = lop + '||' + file;
      if (seen.has(key)) return;
      seen.add(key);
      list.push({ url: buildUrl(folder + '/' + file), lop });
    });
  });
  if (!list.length) {
    console.error('IMAGE_DATA rỗng → dùng logo dự phòng');
    PHOTOS = [{ url: FALLBACK_IMG, lop: 'Quốc Học Huế' }];
  } else {
    console.log('✅ Đã nạp ' + list.length + ' ảnh (' + Object.keys(IMAGE_DATA).length + ' lớp)');
    PHOTOS = interleaveByClass(list);
  }
  start();
}

// Trộn ngẫu nhiên nhưng RẢI ĐỀU các lớp — tránh xem nhiều ảnh cùng lớp liên tiếp
// (vì có lớp 80 ảnh, lớp chỉ 4 ảnh; shuffle thuần sẽ dồn cục)
function interleaveByClass(list) {
  // Gom ảnh theo lớp, shuffle nội bộ từng lớp
  const buckets = {};
  list.forEach(item => {
    (buckets[item.lop] = buckets[item.lop] || []).push(item);
  });
  Object.keys(buckets).forEach(lop => buckets[lop] = shuffle(buckets[lop]));

  // Rải vòng: mỗi vòng lấy 1 ảnh từ mỗi lớp (theo thứ tự lớp ngẫu nhiên)
  const result = [];
  const lops = Object.keys(buckets);
  let remaining = list.length;
  while (remaining > 0) {
    const order = shuffle(lops.slice());  // mỗi vòng đảo thứ tự lớp
    order.forEach(lop => {
      if (buckets[lop].length) {
        result.push(buckets[lop].shift());
        remaining--;
      }
    });
  }
  return result;
}

function buildUrl(relPath) {
  return IMAGE_BASE + relPath.split('/').map(s => encodeURIComponent(s)).join('/');
}

function lopToFolder(lop) {
  return lop.toLowerCase().replace(/\//g,'-').replace(/\s+/g,'-')
    .replace(/á|à|ả|ã|ạ|ă|ắ|ằ|ẳ|ẵ|ặ|â|ấ|ầ|ẩ|ẫ|ậ/g,'a')
    .replace(/é|è|ẻ|ẽ|ẹ|ê|ế|ề|ể|ễ|ệ/g,'e')
    .replace(/í|ì|ỉ|ĩ|ị/g,'i')
    .replace(/ó|ò|ỏ|õ|ọ|ô|ố|ồ|ổ|ỗ|ộ|ơ|ớ|ờ|ở|ỡ|ợ/g,'o')
    .replace(/ú|ù|ủ|ũ|ụ|ư|ứ|ừ|ử|ữ|ự/g,'u')
    .replace(/ý|ỳ|ỷ|ỹ|ỵ/g,'y').replace(/đ/g,'d');
}

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function start() {
  document.getElementById('imgCounter').textContent = '1 / ' + PHOTOS.length;
  preload(PHOTOS[0].url, () => {
    document.getElementById('loading').style.display = 'none';
    showPhoto(0, true);
    scheduleNext();
  });
}
function preload(url, cb){ const im=new Image(); im.onload=cb; im.onerror=cb; im.src=url; }

function showPhoto(i, first) {
  const photo = PHOTOS[i];
  const nf = first ? 0 : (flip ^ 1);
  const card = document.getElementById('card'+nf);
  const imgEl = document.getElementById('img'+nf);
  const bd = document.getElementById('bd'+nf);
  const oldCard = document.getElementById('card'+flip);
  const oldBd = document.getElementById('bd'+flip);
  imgEl.src = photo.url;
  bd.style.backgroundImage = "url('" + photo.url + "')";
  const apply = () => {
    bd.classList.add('active');
    if (oldBd && oldBd !== bd) oldBd.classList.remove('active');
    if (!first && oldCard && oldCard !== card) {
      oldCard.classList.remove('active');
      oldCard.classList.add('exit');
      setTimeout(() => oldCard.classList.remove('exit'), 900);
    }
    card.classList.add('active');
    flip = nf;
  };
  if (imgEl.complete && imgEl.naturalWidth) apply();
  else { imgEl.onload = apply; imgEl.onerror = apply; }
  document.getElementById('imgCounter').textContent = (i+1) + ' / ' + PHOTOS.length;
  runProgress();
  preload(PHOTOS[(i+1) % PHOTOS.length].url, () => {});
}

function scheduleNext() {
  clearTimeout(timer);
  timer = setTimeout(() => { idx = (idx + 1) % PHOTOS.length; showPhoto(idx, false); scheduleNext(); }, SLIDE_DURATION);
}

function runProgress() {
  const p = document.getElementById('slideProgress');
  p.style.transition = 'none'; p.style.width = '0';
  requestAnimationFrame(() => { p.style.transition = 'width ' + SLIDE_DURATION + 'ms linear'; p.style.width = '100%'; });
}

function pad(n){ return String(n).padStart(2,'0'); }
function tick() {
  let diff = TARGET - new Date();
  if (diff < 0) diff = 0;
  document.getElementById('cd-d').textContent = pad(Math.floor(diff/86400000));
  document.getElementById('cd-h').textContent = pad(Math.floor((diff%86400000)/3600000));
  document.getElementById('cd-m').textContent = pad(Math.floor((diff%3600000)/60000));
  document.getElementById('cd-s').textContent = pad(Math.floor((diff%60000)/1000));
  if (diff === 0) document.querySelector('.cd-eyebrow').textContent = '🎉 Ngày hội ngộ đã đến!';
}

tick();
setInterval(tick, 1000);
loadManifest();
